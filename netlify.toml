# Configuracion de Netlify — Icho no Ki
#
# El sitio es HTML/CSS/JS plano: no hay nada que compilar.
# Netlify publica los archivos del repo tal como estan.
#
# Lo que este archivo define le gana a lo que este cargado
# en el panel web, asi que la config queda versionada aca.

[build]
  # Sin comando de build: no hay package.json ni generador de sitios
  command = ""
  # La raiz del repo es la raiz del sitio
  publish = "."
  # Login del panel: netlify/functions/auth.mjs y callback.mjs
  functions = "netlify/functions"

# Una sola direccion oficial. Hasta ahora el sitio respondia igual con y sin
# www: eso divide el posicionamiento en Google y rompe el login del panel,
# porque el dominio tiene que coincidir con el base_url de admin/config.yml.
[[redirects]]
  from = "https://www.ichonokidojo.com.ar/*"
  to = "https://ichonokidojo.com.ar/:splat"
  status = 301
  force = true
